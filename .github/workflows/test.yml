name: Tests

# Runs the tests for the trip verdict, chain control, closure direction, data fallback and change alerts on
# every pull request and on every push to main. Kept apart from the deploy workflow on purpose: that one is
# triggered every 15 minutes to refresh data and must not depend on anything but the feeds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/*.test.mjs"
