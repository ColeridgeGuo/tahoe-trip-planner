name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from the top of the hour where GitHub's scheduler is busiest.
    # Scheduled runs can still be delayed; the page also pulls chain control live from Caltrans.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Caltrans, CHP and NWS data
        run: node scripts/fetch.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg css js data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
