name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stale_min:
        description: Set only by the watchdog workflow - minutes since the published data was last refreshed
        required: false
        default: ''
  # No `schedule:` here on purpose. The 15-minute refresh is triggered from outside by a cron-job that calls
  # workflow_dispatch; GitHub's own scheduler was late and would now only duplicate those runs.

permissions:
  contents: read
  pages: write
  id-token: write

# A run that is already fetching is left to finish and the new one starts after it (GitHub keeps only the
# newest waiting run). Cancelling it half-way threw away the TomTom requests it had already sent: they were
# neither published nor counted, and the next run sent them again.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Caltrans, CHP, NWS and TomTom data
        run: node scripts/fetch.mjs
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
      # Change alerts: pushes a notification if the verdict or chain level changed for the departure being watched.
      # Does nothing until ALERT_GIST_ID is set, and never fails the run.
      - name: Send change alerts
        run: node scripts/notify.mjs
        env:
          ALERT_GIST_ID: ${{ secrets.ALERT_GIST_ID }}
          # Set when the watchdog started this run because the scheduled refresh had stopped.
          WATCHDOG_AGE_MIN: ${{ inputs.stale_min }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon.svg icon-*.png css js data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Now and then the deploy step cannot see the artifact uploaded a second before it ("No artifacts named
      # github-pages were found", run 269 on 20 Nov 2026). The data was fetched and any alerts were sent, but
      # nothing was published: the TomTom requests went uncounted and the alerts were sent again by the next
      # run. Waiting a little and deploying once more gets it published.
      - name: Wait before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: redeploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
