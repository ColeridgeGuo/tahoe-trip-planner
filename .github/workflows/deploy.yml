name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # No `schedule:` here on purpose. The 15-minute refresh is triggered from outside by a cron-job that calls
  # workflow_dispatch; GitHub's own scheduler was late and would now only duplicate those runs.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Caltrans, CHP, NWS and TomTom data
        run: node scripts/fetch.mjs
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
      # Change alerts: pushes a notification if the verdict or chain level changed for the departure being watched.
      # Does nothing until ALERT_GIST_ID is set, and never fails the run.
      - name: Send change alerts
        run: node scripts/notify.mjs
        env:
          ALERT_GIST_ID: ${{ secrets.ALERT_GIST_ID }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon.svg icon-*.png css js data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
