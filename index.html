<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tahoe Trip Planner</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('tr.theme'))||'auto'}catch(e){}</script>
<!-- Start downloading the data now, while the scripts are still loading; js/app.js picks it up (window.__boot).
     A share link (?resort=) names the destination to show, ahead of the saved one. -->
<script>try{var d=new URLSearchParams(location.search).get('resort')||JSON.parse(localStorage.getItem('tr.dest'))||'heavenly';if(/^[a-z0-9-]+$/.test(d)){window.__boot={id:d,p:fetch('data/'+d+'.json?ts='+Math.floor(Date.now()/6e4),{cache:'no-store'})};window.__boot.p.catch(function(){})}}catch(e){}</script>
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tahoe Trips">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css">
<!-- The modules js/app.js imports, fetched alongside it instead of after it has been read. Keep in step with its imports. -->
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/config.js">
<link rel="modulepreload" href="js/normalize.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/sync.js">
<link rel="modulepreload" href="js/alerts.js">
<link rel="modulepreload" href="js/food.js">
<link rel="modulepreload" href="js/logic.js">
<link rel="modulepreload" href="js/share.js">
</head>
<body>
<header>
  <div class="bar">
    <div id="title"></div>
    <div id="toggles"></div>
  </div>
</header>
<nav id="tabs"></nav>
<div id="offline" role="status" hidden></div>
<div id="quotawarn" role="status" hidden></div>
<main id="main"></main>
<footer><span id="status"></span><span id="quota"></span><span id="foot"></span></footer>
<dialog id="dlg"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
